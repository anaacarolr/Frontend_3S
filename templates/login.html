{% extends 'base.html' %}

{% block conteudo %}


<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 350px; height: auto; border-radius: 15px;">
        <h2 class="text-center mb-4">Login</h2>

        <!-- ADICIONADO: Tag form com a rota de login -->
        <form id="form-login" action="{{ url_for('login') }}" method="post">

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input id="input-email" type="email" name="form-email" class="form-control" placeholder="seu@email.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha:</label>
                <input id="input-senha" type="password" name="form-senha" class="form-control" placeholder="******" required>
            </div>

            <button type="submit" class="btn btn-info w-100 mt-2 text-white">Entrar</button>
            <a  class="btn btn-danger w-100 mt-2 text-white" onclick="limpaInputsLogin()">Cancelar</a>

            <div class="text-center mt-3">
                <small>Não tem conta? <a href="" data-bs-toggle="modal" data-bs-target="#staticBackdrop">Cadastre-se</a></small>
            </div>
            <!-- Modal -->
            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
                 aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form class="form-somar" action="{{ url_for('cadastro_funcionario') }}" method="post">
                                <label>
                                    Nome:
                                    <input placeholder="Digite o nome" name="nome" class="form-control w-100">
                                </label>
                                <label>
                                    Data Nascimento:
                                    <input type="date" name="data_nascimento" class="form-control w-100">
                                </label>
                                <label>
                                    CPF:
                                    <input placeholder="000.000.000-00" name="cpf" class="form-control">
                                </label>
                                <label>
                                    Email:
                                    <input placeholder="Digite o email" type="email" name="email"
                                           class="form-control w-100">
                                </label>

                                <label>
                                    Cargo:
                                    <input placeholder="Digite o cargo" name="cargo" class="form-control w-100">
                                </label>
                                <label>
                                    Salário:
                                    <input placeholder="Digite o salário" type="number" step="0.01" name="salario"
                                           class="form-control w-100">
                                </label>

                                <button type="submit" class="btn btn-info" style="margin: 20px;">Cadastrar</button>
                            </form>

                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
